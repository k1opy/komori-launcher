<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://cdn.modrinth.com https://media.forgecdn.net; connect-src 'none'">
<title>Komori Launcher</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body class="theme-dark">
<div class="app">
  <aside class="side">
    <div class="brand drag"><img class="brand-logo" src="assets/logo.svg" alt=""><span class="brand-word">KOMORI</span></div>
    <nav class="nav" id="nav" aria-label="Разделы"></nav>
    <div class="grow"></div>
    <div id="devBadge" class="dev-badge hidden">DEV-сборка</div>
    <div id="updBanner" class="upd-banner hidden"></div>
    <div class="side-foot">
      <button type="button" class="acc-chip" id="accChip" title="Аккаунт и скин"></button>
      <button type="button" class="gear" id="gearBtn" data-act="nav" data-id="settings" aria-label="Настройки" title="Настройки"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
    </div>
  </aside>
  <main class="main">
    <div class="titlebar drag">
      <div class="win-btns no-drag">
        <button type="button" class="win-btn" id="wMin" aria-label="Свернуть"><svg width="11" height="11" viewBox="0 0 12 12"><path d="M1 6h10" stroke="currentColor" stroke-width="1.5"/></svg></button>
        <button type="button" class="win-btn" id="wMax" aria-label="Развернуть"><svg width="11" height="11" viewBox="0 0 12 12"><rect x="1.5" y="1.5" width="9" height="9" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></button>
        <button type="button" class="win-btn close" id="wClose" aria-label="Закрыть"><svg width="11" height="11" viewBox="0 0 12 12"><path d="M2 2l8 8M10 2l-8 8" stroke="currentColor" stroke-width="1.5"/></svg></button>
      </div>
    </div>
    <div class="view" id="view"></div>
  </main>
</div>
<div id="modal" class="modal hidden"></div>
<div id="manual" class="modal hidden"></div>
<div id="crash" class="modal hidden"></div>
<div id="toast" class="toast hidden" role="status"></div>
<script src="picons.js"></script>
<script src="app.js"></script>
</body>
</html>
