# Автосборка Komori Launcher: при пуше в ветку release (или тега v*) GitHub собирает установщик
# на Windows и публикует его в Releases с тегом v<версия из package.json> (+ latest.yml для автообновления).
# Выпустить новую версию: поднять "version" в package.json, закоммитить в main, затем
#   git push origin main:release
name: Release

on:
  push:
    branches: [release]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Установка зависимостей
        run: npm install --no-audit --no-fund

      - name: Секреты в komori.config.json (только внутри сборки)
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          CRASH_WEBHOOK_URL: ${{ secrets.CRASH_WEBHOOK_URL }}
        run: node scripts/inject-secrets.js

      - name: Сборка и публикация
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis --publish always
