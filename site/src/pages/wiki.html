<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Вики — Komori</title>
<meta name="description" content="Вики сервера Komori: рыбалка, рыбы, снасти, зачарования, экономика, топы и команды.">
<!--KOMORI_HEAD-->
</head>
<body>
<x-dc>
<helmet>
<style>
.wk-hero{max-width:1240px;margin:0 auto;padding:48px 24px 28px;display:flex;flex-direction:column;gap:18px}
.wk-hero h1{margin:0;font-family:'Montserrat',sans-serif;font-weight:800;font-size:clamp(32px,4.5vw,52px);color:#fff}
.wk-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px}
.wk-intro{margin:0;color:#C7BBE6;max-width:680px;font-size:18px}
.wk-search{display:flex;align-items:center;gap:10px;max-width:560px;padding:0 14px;border-radius:12px;border:1px solid #2E2250;background:#170F2B}
.wk-search input{flex:1;min-height:48px;border:none;background:transparent;color:#fff;font:inherit;outline:none}
.wk-main{max-width:1240px;margin:0 auto;padding:0 24px 80px;display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start}
.wk-nav{flex:1 1 240px;background:#170F2B;border:1px solid #2E2250;border-radius:18px;padding:8px;display:flex;flex-direction:column;gap:4px}
.wk-nav button{display:flex;flex-direction:column;text-align:left;padding:12px 14px;min-height:44px;border-radius:10px;border:none;background:transparent;color:#EFE8FF;font:inherit;cursor:pointer}
.wk-nav button:hover{background:#1F1638}
.wk-nav button[aria-current="page"]{background:#8B3DFF;color:#fff}
.wk-nav button span:first-child{font-weight:700}
.wk-nav button span:last-child{font-size:13px;color:#B9AED6}
.wk-nav button[aria-current="page"] span:last-child{color:#EBDDFF}
.wk-nav .off{opacity:.5}
.wk-body{flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:20px}
.wk-body h2.t{margin:0;font-family:'Montserrat',sans-serif;font-size:30px;color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{padding:9px 16px;min-height:44px;border-radius:999px;border:1px solid #2E2250;background:#170F2B;color:#C7BBE6;font:inherit;font-weight:700;cursor:pointer}
.chips button[aria-selected="true"]{background:#8B3DFF;border-color:#8B3DFF;color:#fff}
.fishes{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.fishes div{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;background:#130D24;border:1px solid #2E2250}
.fishes span:first-child{flex:0 0 auto;width:34px;height:34px;border-radius:9px;border:2px solid var(--c);color:var(--c);display:flex;align-items:center;justify-content:center;font-family:'Montserrat',sans-serif;font-size:13px;font-weight:800}
.fishes span:last-child{font-weight:600}
.enchs{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.ench{background:#130D24;border:1px solid #2E2250;border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:8px}
.ench .n{font-family:'Montserrat',sans-serif;font-size:16px;font-weight:700;color:var(--c)}
.ench .lv{color:#B9AED6;font-weight:700;margin-left:8px}
.ench .tags{display:flex;flex-wrap:wrap;gap:6px}
.ench .tags span{padding:2px 9px;border-radius:999px;background:#1F1638;color:#C7BBE6;font-size:12px;font-weight:600}
.ench .tags .tr{color:var(--c);font-weight:700}
.ench .tags .sp{background:#3A1840;color:#FF9FD8;font-weight:700}
.ench p{margin:0;color:#D9CCF5;font-size:15px}
.wk-res{display:flex;flex-direction:column;gap:8px}
.wk-res button{display:flex;flex-direction:column;gap:2px;text-align:left;padding:14px 16px;border-radius:14px;border:1px solid #2E2250;background:#130D24;color:#EFE8FF;font:inherit;cursor:pointer}
.wk-res button:hover{border-color:#8B3DFF}
.wk-res small{color:#B57BFF;font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.wk-res span{color:#C7BBE6;font-size:15px}
.wk-empty{background:#130D24;border:1px dashed #4A3A78;border-radius:18px;padding:24px;color:#C7BBE6}
</style>
</helmet>
<div class="{{wrapCls}}" style="min-height:100vh;background:#0E0A1A;color:#EFE8FF;line-height:1.6">

<!--KOMORI_HEADER-->

<section class="wk-hero">
<div class="wk-top"><h1>Вики Komori</h1>
<sc-if value="{{canEdit}}"><button type="button" class="btn-s" onClick="{{startEdit}}">Изменить вики</button></sc-if>
</div>
<sc-if value="{{intro}}"><p class="wk-intro">{{intro}}</p></sc-if>
<div class="wk-search">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B9AED6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
<label for="wikiSearch" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Поиск по вики</label>
<input id="wikiSearch" type="search" placeholder="Поиск: команда, рыба, зачарование…" value="{{q}}" onInput="{{onSearch}}">
</div>
</section>

<section class="wk-main">
<nav class="wk-nav" aria-label="Разделы вики">
<sc-for list="{{tabs}}" as="t"><button type="button" class="{{t.cls}}" onClick="{{t.pick}}" aria-current="{{t.current}}"><span>{{t.label}}</span><span>{{t.hint}}</span></button></sc-for>
</nav>

<div class="wk-body">
<sc-if value="{{searching}}">
<h2 class="t">Поиск</h2>
<sc-if value="{{noResults}}"><div class="wk-empty">Ничего не нашлось. Попробуй другое слово.</div></sc-if>
<div class="wk-res">
<sc-for list="{{results}}" as="r"><button type="button" onClick="{{r.go}}"><small>{{r.where}}</small><b>{{r.title}}</b><span>{{r.text}}</span></button></sc-for>
</div>
</sc-if>

<sc-if value="{{showTab}}">
<sc-if value="{{isFish}}"><div aria-hidden="true" style="position: relative; width: 100%; aspect-ratio: 16 / 5; border-radius: 20px; border: 1px solid #2E2250; overflow: hidden; background: radial-gradient(ellipse 60% 80% at 75% 50%, rgba(95,211,243,.45), transparent 70%), radial-gradient(ellipse 50% 70% at 10% 100%, rgba(139,61,255,.45), transparent 70%), #140E26; display: flex; align-items: center; justify-content: flex-end; padding: 0 8%"><div style="position: absolute; inset: 0; background-image: linear-gradient(rgba(182,107,255,.08) 1px, transparent 1px), linear-gradient(90deg, rgba(182,107,255,.08) 1px, transparent 1px); background-size: 40px 40px"></div><svg viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.85)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="position: relative; width: 28%; max-width: 180px; height: auto; filter: drop-shadow(0 10px 40px rgba(95,211,243,.45))"><path d="M6.5 12c.94-3.46 4.94-6 8.5-6 3.56 0 6.06 2.54 7 6-.94 3.47-3.44 6-7 6s-7.56-2.53-8.5-6Z"></path><path d="M18 12v.5"></path><path d="M16 17.93a9.77 9.77 0 0 1 0-11.86"></path><path d="M7 10.67C7 8 5.58 5.97 2.73 5.5c-1 1.5-1 5 .23 6.5-1.24 1.5-1.24 5-.23 6.5C5.58 18.03 7 16 7 13.33"></path></svg></div></sc-if>
<h2 class="t">{{cur.label}}</h2>
<div class="md" data-html="{{cur.html}}"></div>

<sc-if value="{{isFishList}}">
<div class="chips" role="tablist" aria-label="Биом">
<sc-for list="{{biomeTabs}}" as="b"><button type="button" role="tab" aria-selected="{{b.selected}}" onClick="{{b.pick}}">{{b.name}}</button></sc-for>
</div>
<sc-if value="{{fishEmpty}}"><div class="wk-empty">В этом биоме рыбы пока нет — она появится в следующих обновлениях.</div></sc-if>
<div class="fishes">
<sc-for list="{{fishList}}" as="f"><div><span style="--c:{{f.color}}">{{f.rank}}</span><span>{{f.name}}</span></div></sc-for>
</div>
</sc-if>

<sc-if value="{{isEnch}}">
<div class="chips" role="tablist" aria-label="Предмет">
<sc-for list="{{enchFilters}}" as="ef"><button type="button" role="tab" aria-selected="{{ef.selected}}" onClick="{{ef.pick}}">{{ef.label}} <span style="opacity:.75">{{ef.count}}</span></button></sc-for>
</div>
<div class="enchs">
<sc-for list="{{enchList}}" as="e">
<div class="ench" style="--c:{{e.color}}">
<div><span class="n">{{e.name}}</span><span class="lv">{{e.max}}</span></div>
<div class="tags"><span class="tr">Тир {{e.tier}}</span><sc-if value="{{e.special}}"><span class="sp">Особое</span></sc-if><span>{{e.types}}</span></div>
<p>{{e.desc}}</p>
</div>
</sc-for>
</div>
</sc-if>
</sc-if>
</div>
</section>

<!--KOMORI_FOOTER-->
</div>
<!--KOMORI_DOCK-->
</x-dc>
