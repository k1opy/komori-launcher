<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Правила — Komori</title>
<meta name="description" content="Правила сервера Komori: Minecraft, Discord и другие площадки проекта.">
<!--KOMORI_HEAD-->
</head>
<body>
<x-dc>
<helmet>
<style>
.rl-hero{max-width:1240px;margin:0 auto;padding:56px 24px 32px;display:flex;flex-direction:column;gap:24px}
.rl-hero h1{margin:0;font-family:'Montserrat',sans-serif;font-weight:800;font-size:clamp(32px,4.5vw,52px);color:#fff}
.rl-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px}
.rl-intro{margin:0;color:#C7BBE6;max-width:720px;font-size:18px}
.rl-intro p{margin:0 0 8px}
.rl-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.rl-card{background:#170F2B;border:1px solid #2E2250;border-radius:14px;padding:18px;display:flex;gap:12px;align-items:flex-start}
.rl-card svg{flex:0 0 auto;width:26px;height:26px}
.rl-card b{color:#fff}
.rl-card span span{color:#C7BBE6;font-size:15px}
.rl-main{max-width:1240px;margin:0 auto;padding:0 24px 80px;display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start}
.rl-nav{flex:1 1 240px;background:#170F2B;border:1px solid #2E2250;border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:2px;position:sticky;top:84px}
.rl-nav a{display:flex;gap:10px;align-items:center;padding:12px;border-radius:10px;text-decoration:none;color:#EFE8FF;font-weight:600}
.rl-nav a:hover{background:#1F1638;color:#fff}
.rl-nav a span{min-width:28px;height:28px;border-radius:8px;background:#2A1E4A;color:#D9B8FF;display:flex;align-items:center;justify-content:center;font-family:'Montserrat',sans-serif;font-size:13px;font-weight:800}
.rl-list{flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:24px}
.rl-sec{background:#130D24;border:1px solid #2E2250;border-radius:20px;padding:28px;display:flex;flex-direction:column;gap:18px;scroll-margin-top:90px}
.rl-sec-h{display:flex;align-items:center;gap:14px}
.rl-sec-h span{width:52px;height:52px;border-radius:14px;background:#8B3DFF;color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Montserrat',sans-serif;font-size:22px;font-weight:800;flex:0 0 auto}
.rl-sec-h h2{margin:0;font-family:'Montserrat',sans-serif;font-size:24px;color:#fff}
.rl-sec .md h4{font-size:18px;color:#E6D2FF;margin:14px 0 8px;font-family:'Inter',sans-serif}
.rl-sec .md-card b{color:#FF9FD8;font-family:'Inter',sans-serif;font-size:16px}
.rl-sec .md p{color:#C7BBE6;font-size:15px}
@media (max-width:840px){.rl-nav{position:static}}
</style>
</helmet>
<div class="{{wrapCls}}" style="min-height:100vh;background:#0E0A1A;color:#EFE8FF;line-height:1.6">

<!--KOMORI_HEADER-->

<section class="rl-hero">
<div class="rl-top"><h1>Правила проекта</h1>
<sc-if value="{{canEdit}}"><button type="button" class="btn-s" onClick="{{startEdit}}">Изменить правила</button></sc-if>
</div>
<div class="rl-intro" data-html="{{introHtml}}"></div>
<sc-if value="{{hasCards}}">
<div class="rl-cards">
<sc-for list="{{cards}}" as="c">
<div class="rl-card"><span data-html="{{c.icon}}"></span><span><b data-html="{{c.title}}"></b><br><span data-html="{{c.text}}"></span></span></div>
</sc-for>
</div>
</sc-if>
</section>

<section class="rl-main">
<nav class="rl-nav" aria-label="Разделы правил">
<sc-for list="{{sections}}" as="s"><a href="#{{s.id}}"><span>{{s.num}}</span>{{s.title}}</a></sc-for>
</nav>
<div class="rl-list">
<sc-for list="{{sections}}" as="s">
<article class="rl-sec" id="{{s.id}}">
<div class="rl-sec-h"><span>{{s.num}}</span><h2>{{s.title}}</h2></div>
<div class="md" data-html="{{s.html}}"></div>
</article>
</sc-for>
</div>
</section>

<!--KOMORI_FOOTER-->
</div>
<!--KOMORI_DOCK-->
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { text: (window.KOMORI || {}).content || '', draft: null, dock: null };
}
renderVals() {
var self = this, s = this.state, md = window.KomoriMD;
var text = s.draft != null ? s.draft : s.text;
// Разбор: всё до первого «## » — вступление и карточки; дальше каждый «## » — раздел, «### » внутри — подраздел с номером
var lines = text.replace(/\r/g, '').split('\n'), intro = [], cards = [], secs = [], cur = null;
lines.forEach(function (l) {
var h = /^##\s+(.+)$/.exec(l.trim());
if (h) { cur = { title: h[1].replace(/^\d+\.\s*/, ''), lines: [] }; secs.push(cur); return; }
if (cur) { cur.lines.push(l); return; }
var c = /^\+\s+(.*)$/.exec(l.trim());
if (c) { var p = c[1].split(' | '); cards.push({ title: p.shift(), text: p.join(' | ') }); } else intro.push(l);
});
var ICONS = ['<path d="M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7z"/><path d="M9 12l2 2 4-4"/>', '<path d="M3 21h18M5 21V9l7-5 7 5v12"/><path d="M10 21v-6h4v6"/>',
'<path d="M20 12a8 8 0 0 1-11.6 7.1L4 20l1-4.2A8 8 0 1 1 20 12z"/>', '<circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/>'];
var inl = window.KomoriInline;
return {
wrapCls: s.dock ? 'editing' : '',
canEdit: !!(window.KomoriBase().admin && !s.dock),
introHtml: md(intro.join('\n')),
hasCards: cards.length > 0,
cards: cards.map(function (c, i) {
return { icon: '<svg viewBox="0 0 24 24" fill="none" stroke="#B57BFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICONS[i % ICONS.length] + '</svg>', title: inl(c.title), text: inl(c.text) };
}),
sections: secs.map(function (sec, i) {
var n = 0, body = sec.lines.map(function (l) {
var g = /^###\s+(.+)$/.exec(l.trim());
return g ? '### ' + (i + 1) + '.' + (++n) + '. ' + g[1].replace(/^\d+(\.\d+)*\.?\s+/, '') : l;
}).join('\n');
return { id: 's' + (i + 1), num: i + 1, title: sec.title, html: md(body) };
}),
startEdit: function () { self.setState({ dock: {}, draft: s.text }); },
d: window.KomoriDockVals(this, {
key: 'rules', title: 'Правила',
note: 'Страница сразу показывает, как будет. «## » — новый раздел, «### » — подраздел, «1.1 текст» — пункт, «+ Название | описание» — карточка.',
text: text,
onText: function (v) { self.setState({ draft: v }); },
onCancel: function () { self.setState({ draft: null }); },
data: function () { return self.state.draft; },
onSaved: function (x) { self.setState({ text: x.data, draft: null }); }
})
};
}
}
</script>
</body>
</html>
