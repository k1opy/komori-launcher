<!--HEAD-->
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/assets/favicon.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<meta name="theme-color" content="#0E0A1A">
<link rel="preload" href="/assets/Montserrat.woff" as="font" type="font/woff" crossorigin>
<link rel="stylesheet" href="/assets/site.css">
<!--BOOT-->
<script src="/komori-dc.js" defer></script>
<!--HEADER-->
<header class="k-head">
<div class="k-head-in">
<a href="/" class="k-brand" aria-label="Komori — на главную"><img src="/assets/logo.svg" alt=""><span>KOMORI</span></a>
<nav class="k-nav" aria-label="Основное меню">
<sc-for list="{{K.nav}}" as="n"><a href="{{n.href}}" aria-current="{{n.current}}">{{n.label}}</a></sc-for>
</nav>
<div class="k-user">
<sc-if value="{{K.loggedIn}}">
<a href="/profile" class="k-me"><img src="{{K.avatar}}" alt="" width="32" height="32">{{K.name}}</a>
<button type="button" class="k-out" onClick="{{K.logout}}" aria-label="Выйти" title="Выйти"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><path d="M16 17l5-5-5-5"></path><path d="M21 12H9"></path></svg></button>
</sc-if>
<sc-if value="{{K.loggedOut}}">
<a href="{{K.loginUrl}}" class="k-login"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><path d="M10 17l5-5-5-5"></path><path d="M15 12H3"></path></svg>Войти<span>&nbsp;через&nbsp;Discord</span></a>
</sc-if>
</div>
</div>
<sc-if value="{{K.flash}}">
<div class="k-flash" role="status"><div>{{K.flash}} <sc-if value="{{K.flashJoin}}"><a href="{{K.discord}}" target="_blank" rel="noopener" style="color:#fff">Зайти на сервер Discord</a></sc-if></div></div>
</sc-if>
</header>
<!--FOOTER-->
<footer class="k-foot">
<div class="k-foot-in">
<div class="k-foot-brand"><img src="/assets/logo.svg" alt=""><span>© 2026 Komori · mc.komori.fun · Не связан с Mojang и Microsoft.</span></div>
<nav class="k-foot-links" aria-label="Ссылки"><a href="/rules">Правила</a><a href="/wiki">Вики</a><a href="/map">Карта</a><a href="{{K.launcher}}">Лаунчер</a><a href="{{K.discord}}" target="_blank" rel="noopener">Discord</a><sc-for list="{{K.social}}" as="s"><a href="{{s.url}}" target="_blank" rel="noopener">{{s.name}}</a></sc-for></nav>
</div>
</footer>
<!--END-->
